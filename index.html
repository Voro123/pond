<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101513"><title>庭间 · 镜水庭</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="header-inner"><div class="brand"><span class="crest" aria-hidden="true">波</span><div><strong>庭 间</strong><small>NIWA GARDEN</small></div></div>
<nav aria-label="主导航"><button id="home" class="active"><i data-i="wave"></i>观鱼庭</button><button id="atlas"><i data-i="book"></i>生物图鉴</button><button id="nursery"><i data-i="sprout"></i>蛙舍</button><button id="journal"><i data-i="journal"></i>庭院手记</button></nav><button id="market" class="market"><span>◇</span> 鱼市 <b id="wallet"></b><small id="marketTime" title="距下批到货"></small><em id="marketDot" hidden aria-label="有未查看的新货"></em></button><div class="header-actions"><button class="sound" id="sound" aria-pressed="false"><i data-i="mute"></i><span>环境音</span></button><button id="guideHelp" aria-label="重看新手教程" title="新手教程">?</button></div></div></header>
<main><section class="heading"><div><div class="overline"><span class="line"></span> NIWA · WATER GARDEN</div><h1>镜水庭 <span class="stamp">水庭</span></h1></div><div class="season"><i data-i="sun"></i><span><span id="region">荷岸浅滩</span></span><b></b><i data-i="clock"></i><span id="clock"></span></div></section>
<div class="layout"><div class="left"><section id="pond" aria-label="交互鱼池"><canvas id="water" tabindex="0" aria-label="拖动探索池塘，方向键移动视野"></canvas><div class="live glass"><em></em>池塘全景</div><button id="expand" class="glass" aria-label="全屏鱼池"><i data-i="expand"></i></button><div id="marker"></div><div id="hint" class="glass"><i data-i="pointer"></i><span>拖动游园 · 轻点生物观察</span></div></section>
<section class="tools"><div class="tool-title"><i data-i="tool"></i><h2>庭院工具</h2></div><div id="bait" hidden aria-label="饵料选择"><button data-bait="grain">鱼粮</button><button data-bait="algae">藻屑</button></div><div id="modes"><button data-mode="observe" class="chosen"><i data-i="eye"></i>观察</button><button data-mode="feed"><i data-i="feed"></i>投喂</button><button data-mode="ripple"><i data-i="wave"></i>拨水</button><button id="hunt"><i data-i="scan"></i>寻踪</button></div></section></div>
<aside hidden><button class="fold" aria-label="收起档案">收起 ↓</button><section class="card profile"><div class="card-head"><h2><i data-i="scan"></i>生物档案</h2><small id="serial"></small></div><div class="portrait"><div class="orbits"></div><span class="corner tl"></span><span class="corner br"></span><img id="portrait" alt="当前生物的外观"></div>
<div class="name-row"><div><h3 id="fishName"></h3><div id="breed"></div></div><button id="follow"><i data-i="star"></i><span>关注</span></button></div><div class="stats"><div><label>体长</label><strong id="length"></strong><small> cm</small></div><div><label>年龄</label><strong id="age"></strong><small> 天</small></div><div><label>性情</label><span id="nature"></span></div></div>
<div class="growth"><div><span><i data-i="sprout"></i>成长进度</span><span id="phase"></span></div><div class="bar"><b id="progress"></b></div></div><div class="foodstat"><label>饱食度 <span id="hunger"></span></label><div class="bar"><b id="foodbar"></b></div><small id="careInfo"></small><small id="life"></small><small id="family"></small><small id="traits"></small><small id="fieldHabit"></small><small id="incomeInfo"></small></div><div class="valuation"><span id="quality"></span><button id="releaseFish">放生 · 免费</button><button id="sell">出售</button></div></section>
<section class="card stock"><div class="card-head"><h2><i data-i="fish"></i>池中生物</h2><small id="count"></small></div><div id="fishList"></div><button id="buyMore">＋ 前往鱼市</button></section></aside></div>
<button id="inspect"><img alt="" id="peekImg"><span><small>观察档案</small><b id="peekName"></b></span><i>⌃</i></button><div id="mapBox"><button id="expandHabitat">＋ 扩建鱼池 · 300 玉</button><section id="zoneJumps" hidden><button data-zone="pond">镜水庭</button><button data-zone="reef">潮间礁池</button></section><div><button id="zones">水域舆图 ↗</button><span>点击定位</span></div><canvas id="map" aria-label="池塘地图"></canvas><div id="mapClock"><time></time><b>100×</b></div><small id="pondElapsed"></small><button id="visitorHint" hidden></button><button id="returnStory" hidden></button><button id="debrisHint" hidden></button></div><footer><span><em></em><span id="saved">本地存档已同步</span></span><span><i data-i="clock"></i>时间流速 <b>100×</b></span></footer></main>
<div id="huntHud" hidden><img alt="目标花纹"><div><small id="huntCounter"></small><strong id="huntTarget"></strong></div><b id="huntTimer"></b><button id="endHunt" aria-label="结束寻鲤">×</button></div><div id="notice" role="status" hidden></div><dialog><div class="card-head"><h2 id="modalTitle"></h2><button id="close" aria-label="关闭">×</button></div><div id="modalBody"></div></dialog>
<dialog id="guide" aria-labelledby="guideTitle" aria-describedby="guideText">
<div class="guide-shade"></div><div class="guide-ring"></div>
<section class="guide-card"><small id="guideCount"></small><h2 id="guideTitle"></h2><p id="guideText"></p>
<div class="guide-actions"><button id="guideSkip">跳过</button><button id="guideNext" autofocus>下一步</button></div></section>
</dialog>
